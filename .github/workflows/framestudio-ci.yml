name: Frame Studio CI

on:
  push:
    paths:
      - "FrameStudio.*/**"
      - "scripts/package-windows-candidate.py"
      - "FrameStudio.sln"
      - "global.json"
      - ".github/workflows/framestudio-ci.yml"
  pull_request:
    paths:
      - "FrameStudio.*/**"
      - "scripts/package-windows-candidate.py"
      - "FrameStudio.sln"
      - "global.json"
      - ".github/workflows/framestudio-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FrameStudio.sln
      - run: dotnet build FrameStudio.sln --configuration Release --no-restore
      - name: Run deterministic Frame Studio tests
        shell: pwsh
        run: >-
          dotnet test FrameStudio.sln --configuration Release --no-build
          --filter "FullyQualifiedName!~WindowsCaptureIntegrationTests"
      - name: Run native Windows capture integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet test FrameStudio.sln --configuration Release --no-build
          --filter "FullyQualifiedName~WindowsCaptureIntegrationTests"

  windows-package:
    name: Windows x64 publish check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python scripts/package-windows-candidate.py
      - name: Smoke-launch packaged Windows app
        shell: pwsh
        run: |
          $application = Join-Path $PWD "dist/FrameStudio-win-x64/FrameStudio.Avalonia.exe"
          $process = Start-Process -FilePath $application -PassThru
          try {
            if ($process.WaitForExit(10000)) {
              throw "The packaged app exited during startup with code $($process.ExitCode)."
            }
            Write-Host "The packaged app stayed running for the 10-second startup smoke window."
          }
          finally {
            if (-not $process.WaitForExit(5000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (-not $process.WaitForExit(5000)) {
                throw "The packaged app process did not exit after cleanup."
              }
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: FrameStudio-win-x64
          path: |
            dist/FrameStudio-win-x64.zip
            dist/FrameStudio-win-x64.zip.sha256
          if-no-files-found: error
